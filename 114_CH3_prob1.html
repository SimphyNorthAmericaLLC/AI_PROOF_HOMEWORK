<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanging Mass Experimental Investigation</title>
<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}
.container {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}
.controls {
    width:95%;
    max-width:1100px;
    background:#1e1e1e;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}
canvas {
    background:white;
    border-radius:8px;
    margin-top:10px;
}
button {
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background:#0ea5e9;
    color:white;
    cursor:pointer;
    margin-top:10px;
}
button:hover {
    background:#0284c7;
}
#hoverReadout {
    margin-top:14px;
    color:#22d3ee;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>
<body>
<div class="container">

<h1 style="color:#7dd3fc">Experimental Hanging-Mass Investigation</h1>

<div class="controls">
<button onclick="generateTrial()">Generate Experimental Trial</button>
</div>

<canvas id="simCanvas" width="1100" height="260"></canvas>
<canvas id="plotCanvas" width="1100" height="420"></canvas>

<div id="hoverReadout"></div>

</div>

<script>

const simCanvas = document.getElementById('simCanvas');
const simCtx = simCanvas.getContext('2d');

const plotCanvas = document.getElementById('plotCanvas');
const plotCtx = plotCanvas.getContext('2d');

const hoverReadout = document.getElementById('hoverReadout');

// hidden parameters
const g = 9.81;
const cartMass1 = 0.245;
const cartMass2 = 0.245;
const hangingMass = 0.25;
const initialHeight = 0.35;
const hiddenMu = 0.30; // hidden kinetic friction coefficient
const hiddenNoise = 0.015;

let data = [];
let animationTime = 0;
let animationIndex = 0;

function generateTrial() {

    data = [];

    const boxMass = cartMass1 + cartMass2;
    const totalMass = boxMass + hangingMass;

    // true kinetic friction model
    const frictionForce = hiddenMu*boxMass*g;

    const accel = (hangingMass*g - frictionForce)/totalMass;

    const tImpact = Math.sqrt(2*initialHeight/accel);

    const vImpact = accel*tImpact;

    for(let t=0;t<=8;t+=0.05) {

        let v;
        let y;

        if(t <= tImpact) {
            v = accel*t;
            y = initialHeight - 0.5*accel*t*t;
        }
        else {
            v = 0;
            y = 0;
        }

        v += (Math.random()-0.5)*hiddenNoise;
        y += (Math.random()-0.5)*hiddenNoise*0.4;

        if(v < 0) v = 0;
        if(y < 0) y = 0;

        data.push({t,v,y});
    }

    animationIndex = 0;

    drawPlot();
}

function drawSimulation() {

    simCtx.clearRect(0,0,simCanvas.width,simCanvas.height);

    simCtx.fillStyle = 'white';
    simCtx.fillRect(0,0,simCanvas.width,simCanvas.height);

    // ground far below hanging mass
    simCtx.fillStyle = '#16a34a';
    simCtx.fillRect(720,430,380,18);

    simCtx.fillStyle = '#7c4a03';
    simCtx.fillRect(720,448,380,50);

    const trackY = 170;

    simCtx.strokeStyle = '#444';
    simCtx.lineWidth = 4;

    simCtx.beginPath();
    simCtx.moveTo(100,trackY);
    simCtx.lineTo(760,trackY);
    simCtx.stroke();

    // pulley
    simCtx.beginPath();
    simCtx.arc(760,trackY,25,0,2*Math.PI);
    simCtx.stroke();

    if(data.length > 0) {

        const idx = Math.min(animationIndex,data.length-1);

        const t = data[idx].t;

        const boxMass = cartMass1 + cartMass2;
        const totalMass = boxMass + hangingMass;
        const frictionForce = hiddenMu*boxMass*g;
        const accel = (hangingMass*g - frictionForce)/totalMass;

        const tImpact = Math.sqrt(2*initialHeight/accel);

        let x;
        let yMass;

        if(t <= tImpact) {
            x = 160 + 0.5*accel*t*t*420;
            yMass = 120 + Math.min(0.5*accel*t*t*420, initialHeight*420);
        }
        else {
            x = 160 + 0.5*accel*tImpact*tImpact*420;
            yMass = 120 + initialHeight*420;
        }

        // string
        simCtx.strokeStyle = '#000';
        simCtx.lineWidth = 2;

        simCtx.beginPath();
        simCtx.moveTo(x+100,trackY-20);
        simCtx.lineTo(760,trackY-20);
        simCtx.lineTo(760,yMass);
        simCtx.stroke();

        // cart box
        simCtx.fillStyle = '#2563eb';
        simCtx.fillRect(x-20,trackY-70,140,70);

        // friction indication
        simCtx.strokeStyle = '#dc2626';
        simCtx.lineWidth = 5;
        simCtx.beginPath();
        simCtx.moveTo(x+40,trackY-35);
        simCtx.lineTo(x,trackY-35);
        simCtx.stroke();

        // hanging mass
        simCtx.fillStyle = '#ef4444';
        simCtx.beginPath();
        simCtx.arc(760,yMass,14,0,2*Math.PI);
        simCtx.fill();

        if(data[animationIndex].y > 0) {
            animationIndex++;
        }

        if(animationIndex >= data.length) {
            animationIndex = data.length-1;
        }
    }

    requestAnimationFrame(drawSimulation);
}

function drawPlot() {

    plotCtx.clearRect(0,0,plotCanvas.width,plotCanvas.height);

    plotCtx.fillStyle = 'white';
    plotCtx.fillRect(0,0,plotCanvas.width,plotCanvas.height);

    plotCtx.strokeStyle = '#000';
    plotCtx.lineWidth = 2;
    plotCtx.strokeRect(70,30,930,340);

    plotCtx.strokeStyle = '#2563eb';
    plotCtx.lineWidth = 2;

    plotCtx.beginPath();

    for(let i=0;i<data.length;i++) {

        const px = 70 + (data[i].t/8)*930;
        const py = 360 - data[i].v*280;

        if(i===0) plotCtx.moveTo(px,py);
        else plotCtx.lineTo(px,py);
    }

    plotCtx.stroke();

    // y-position curve
    plotCtx.strokeStyle = '#dc2626';
    plotCtx.lineWidth = 2;
    plotCtx.beginPath();

    for(let i=0;i<data.length;i++) {

        const px = 70 + (data[i].t/8)*930;
        const py2 = 360 - data[i].y*320;

        if(i===0) plotCtx.moveTo(px,py2);
        else plotCtx.lineTo(px,py2);
    }

    plotCtx.stroke();

    plotCtx.fillStyle = '#111';
    plotCtx.font = '16px Arial';
    plotCtx.fillText('Experimental Sensor Output',430,400);

    
}

plotCanvas.addEventListener('mousemove',function(e){

    const rect = plotCanvas.getBoundingClientRect();

    const x = e.clientX - rect.left;

    const t = ((x-70)/930)*8;

    if(t >=0 && t<=8) {

        let nearest = data.reduce((prev,curr)=>
            Math.abs(curr.t-t)<Math.abs(prev.t-t)?curr:prev
        );

        hoverReadout.innerHTML =
            'Time = ' + nearest.t.toFixed(2) +
            ' s &nbsp;&nbsp;&nbsp; Speed = ' + nearest.v.toFixed(3) +
            ' m/s &nbsp;&nbsp;&nbsp; y-position = ' + nearest.y.toFixed(3) + ' m';
    }
});

generateTrial();
drawSimulation();

</script>
</body>
</html>
