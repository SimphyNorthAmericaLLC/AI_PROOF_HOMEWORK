
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Resistant JJ Thomson Widget</title>
<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}
.container{
    display:flex;
    height:100vh;
}
.controls{
    width:320px;
    background:#1b1b1b;
    padding:15px;
    border-right:2px solid #333;
}
.plotArea{
    flex:1;
    display:flex;
    flex-direction:column;
}
canvas{
    background:black;
    display:block;
}
#simCanvas{
    flex:2;
}
#plotCanvas{
    flex:1;
    border-top:2px solid #333;
    cursor:crosshair;
}
label{
    display:block;
    margin-top:15px;
}
input{
    width:100%;
}
button{
    margin-top:15px;
    width:100%;
    padding:8px;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
#pauseBtn{
    background:#ffb347;
}
#resetBtn{
    background:#44dd66;
}
.valueDisplay{
    color:#7CFF7C;
}
.infoBox{
    margin-top:16px;
    padding:10px;
    border:1px solid #444;
    background:#151515;
    line-height:1.5;
}
</style>
</head>
<body>

<div class="container">

<div class="controls">

<h2>Crossed Fields Experiment</h2>

<p>
Determine the hidden charge-to-mass relationship from the trajectory.
</p>

<label>Electric Field Ey (N/C):
<span class="valueDisplay" id="EyVal"></span>
</label>
<input type="range" id="Ey" min="-10" max="10" step="0.1" value="-2">

<label>Magnetic Field Bz (T):
<span class="valueDisplay" id="BzVal"></span>
</label>
<input type="range" id="Bz" min="-2" max="2" step="0.01" value="-0.25">

<button id="resetBtn" onclick="resetSim()">Reset Simulation</button>
<button id="pauseBtn" onclick="togglePause()">Pause</button>

<div class="infoBox">
<b>Hover Readout</b><br><br>

t =
<span id="hoverT">---</span> s<br>

y =
<span id="hoverY">---</span> m
</div>

<div class="infoBox">
Known Initial Conditions:<br><br>

vₓ = 10.0 m/s<br>
vᵧ = 0.0 m/s
</div>

</div>

<div class="plotArea">
<canvas id="simCanvas" width="1000" height="600"></canvas>
<canvas id="plotCanvas" width="1000" height="260"></canvas>
</div>

</div>

<script>

const simCanvas=document.getElementById("simCanvas");
const ctx=simCanvas.getContext("2d");

const plotCanvas=document.getElementById("plotCanvas");
const pctx=plotCanvas.getContext("2d");

// Hidden parameters
const q=0.5;
const m=0.8;

const dt=0.03;

const pixelsPerMeter=26.6667;
const xOrigin=80;
const yOrigin=300;

const fieldRegion={
    x1:6,
    x2:24,
    y1:-6,
    y2:6
};

let paused=false;

let particle;
let trail=[];
let plotData=[];
let hoverPoint=null;

function px(x){
    return xOrigin + x*pixelsPerMeter;
}

function py(y){
    return yOrigin - y*pixelsPerMeter;
}

function updateDisplays(){

    EyVal.innerText=
    Number(Ey.value).toFixed(2);

    BzVal.innerText=
    Number(Bz.value).toFixed(2);
}

document.querySelectorAll("input").forEach(el=>{
    el.addEventListener("input",updateDisplays);
});

function resetSim(){

    particle={
        x:0,
        y:0,
        vx:10,
        vy:0
    };

    trail=[];
    plotData=[];
}

function togglePause(){

    paused=!paused;

    pauseBtn.innerText=
    paused ? "Resume":"Pause";
}

updateDisplays();
resetSim();

function insideFieldRegion(){

    return(
        particle.x>=fieldRegion.x1 &&
        particle.x<=fieldRegion.x2 &&
        particle.y>=fieldRegion.y1 &&
        particle.y<=fieldRegion.y2
    );
}

function update(){

    let Eyv=0;
    let Bzv=0;

    if(insideFieldRegion()){

        Eyv=Number(Ey.value);
        Bzv=Number(Bz.value);
    }

    let Fx=q*(particle.vy*Bzv);

    let Fy=q*(Eyv-particle.vx*Bzv);

    let ax=Fx/m;
    let ay=Fy/m;

    particle.vx+=ax*dt;
    particle.vy+=ay*dt;

    particle.x+=particle.vx*dt;
    particle.y+=particle.vy*dt;

    trail.push({
        x:particle.x,
        y:particle.y
    });

    if(trail.length>2000){
        trail.shift();
    }

    plotData.push({
        t:plotData.length*dt,
        y:particle.y
    });

    if(plotData.length>900){
        plotData.shift();
    }
}

function drawFieldRegion(){

    let sx1=px(fieldRegion.x1);
    let sx2=px(fieldRegion.x2);

    let syTop=py(fieldRegion.y2);
    let syBottom=py(fieldRegion.y1);

    ctx.strokeStyle="#777";
    ctx.lineWidth=2;

    ctx.strokeRect(
        sx1,
        syTop,
        sx2-sx1,
        syBottom-syTop
    );

    let Eyv=Number(Ey.value);
    let Bzv=Number(Bz.value);

    for(let x=sx1+30;x<sx2;x+=40){

        for(let y=syTop+30;y<syBottom;y+=40){

            if(Math.abs(Bzv)>1e-6){

                ctx.strokeStyle="#666";

                if(Bzv<0){

                    ctx.beginPath();
                    ctx.moveTo(x-5,y-5);
                    ctx.lineTo(x+5,y+5);

                    ctx.moveTo(x+5,y-5);
                    ctx.lineTo(x-5,y+5);

                    ctx.stroke();

                }else{

                    ctx.beginPath();
                    ctx.arc(x,y,5,0,2*Math.PI);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(x,y,1.5,0,2*Math.PI);
                    ctx.fillStyle="#777";
                    ctx.fill();
                }
            }

            if(Math.abs(Eyv)>1e-6){

                ctx.strokeStyle="yellow";

                ctx.beginPath();

                if(Eyv<0){

                    ctx.moveTo(x+12,y-10);
                    ctx.lineTo(x+12,y+10);

                    ctx.moveTo(x+12,y+10);
                    ctx.lineTo(x+8,y+5);

                    ctx.moveTo(x+12,y+10);
                    ctx.lineTo(x+16,y+5);

                }else{

                    ctx.moveTo(x+12,y+10);
                    ctx.lineTo(x+12,y-10);

                    ctx.moveTo(x+12,y-10);
                    ctx.lineTo(x+8,y-5);

                    ctx.moveTo(x+12,y-10);
                    ctx.lineTo(x+16,y-5);
                }

                ctx.stroke();
            }
        }
    }
}

function drawSimulation(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,simCanvas.width,simCanvas.height);

    drawFieldRegion();

    ctx.strokeStyle="cyan";
    ctx.lineWidth=2;

    ctx.beginPath();

    for(let i=0;i<trail.length;i++){

        let xx=px(trail[i].x);
        let yy=py(trail[i].y);

        if(i===0){
            ctx.moveTo(xx,yy);
        }else{
            ctx.lineTo(xx,yy);
        }
    }

    ctx.stroke();

    let pxx=px(particle.x);
    let pyy=py(particle.y);

    ctx.beginPath();
    ctx.arc(pxx,pyy,8,0,2*Math.PI);

    ctx.fillStyle="white";
    ctx.fill();
}

function drawPlot(){

    pctx.fillStyle="black";
    pctx.fillRect(0,0,plotCanvas.width,plotCanvas.height);

    if(plotData.length<2) return;

    let tVals=plotData.map(d=>d.t);
    let yVals=plotData.map(d=>d.y);

    let tmin=Math.min(...tVals);
    let tmax=Math.max(...tVals);

    let ymin=Math.min(...yVals);
    let ymax=Math.max(...yVals);

    if(Math.abs(ymax-ymin)<1e-6){
        ymax=ymin+1;
    }

    pctx.strokeStyle="#00ff66";
    pctx.lineWidth=2;

    pctx.beginPath();

    for(let i=0;i<plotData.length;i++){

        let x=((tVals[i]-tmin)/(tmax-tmin))
        *plotCanvas.width;

        let y=plotCanvas.height-
        ((yVals[i]-ymin)/(ymax-ymin))
        *plotCanvas.height;

        if(i===0){
            pctx.moveTo(x,y);
        }else{
            pctx.lineTo(x,y);
        }
    }

    pctx.stroke();

    pctx.fillStyle="white";
    pctx.font="15px Arial";

    pctx.fillText("y [m]",20,25);
    pctx.fillText("time [s]",850,245);

    if(hoverPoint){

        pctx.strokeStyle="yellow";

        pctx.beginPath();
        pctx.moveTo(hoverPoint.x,0);
        pctx.lineTo(hoverPoint.x,plotCanvas.height);
        pctx.stroke();

        pctx.beginPath();
        pctx.arc(hoverPoint.x,hoverPoint.y,5,0,2*Math.PI);

        pctx.fillStyle="yellow";
        pctx.fill();
    }
}

plotCanvas.addEventListener("mousemove",function(e){

    if(plotData.length<2) return;

    let rect=plotCanvas.getBoundingClientRect();

    let mouseX=e.clientX-rect.left;

    let index=Math.floor(
        (mouseX/plotCanvas.width)
        *(plotData.length-1)
    );

    if(index<0 || index>=plotData.length) return;

    let tVals=plotData.map(d=>d.t);
    let yVals=plotData.map(d=>d.y);

    let tmin=Math.min(...tVals);
    let tmax=Math.max(...tVals);

    let ymin=Math.min(...yVals);
    let ymax=Math.max(...yVals);

    if(Math.abs(ymax-ymin)<1e-6){
        ymax=ymin+1;
    }

    let pxv=((tVals[index]-tmin)/(tmax-tmin))
    *plotCanvas.width;

    let pyv=plotCanvas.height-
    ((yVals[index]-ymin)/(ymax-ymin))
    *plotCanvas.height;

    hoverPoint={
        x:pxv,
        y:pyv
    };

    hoverT.innerText=
    tVals[index].toFixed(3);

    hoverY.innerText=
    yVals[index].toFixed(3);
});

plotCanvas.addEventListener("mouseleave",function(){

    hoverPoint=null;

    hoverT.innerText="---";
    hoverY.innerText="---";
});

function animate(){

    if(!paused){
        update();
    }

    drawSimulation();
    drawPlot();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
