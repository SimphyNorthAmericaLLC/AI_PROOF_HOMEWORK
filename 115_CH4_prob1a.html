<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossed Fields Experiment</title>
<style>
  :root{color-scheme:dark;--panel:#191c22;--line:#39404b;--green:#70f59a;--cyan:#56d9ff;--yellow:#ffd75e}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#0d0f13;color:#f5f7fa;font:16px Arial,sans-serif}
  .app{display:grid;grid-template-columns:330px minmax(500px,1fr);height:100vh;overflow:hidden}
  .controls{padding:15px 18px;background:var(--panel);border-right:2px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
  h2{margin:0 0 8px}.note{color:#c9d0da;line-height:1.4}
  label{display:block;margin-top:18px}.value{float:right;color:var(--green);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;margin-top:8px}
  input[type=number]{width:100%;margin-top:8px;padding:9px;border:1px solid #56606d;border-radius:5px;background:#0f1217;color:white;font-size:16px}
  .switchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:11px 12px;border:1px solid #56606d;border-radius:6px;background:#11151b}
  .switchRow label{margin:0;font-weight:bold}.switchRow input{width:22px;height:22px;accent-color:#70f59a;cursor:pointer}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  button{padding:10px;border:0;border-radius:5px;font-weight:bold;cursor:pointer}
  #pauseBtn{background:#ffb84d;color:#171717}#resetBtn{background:#55dc78;color:#101510}
  .box{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#12151a;line-height:1.55}
  .readout{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-variant-numeric:tabular-nums}
  .measurement{margin-top:16px;padding:14px;border:2px solid var(--yellow);border-radius:7px;background:#24200f}
  .measurementTitle{color:var(--yellow);font-weight:bold;margin-bottom:10px}
  .measurementGrid{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:baseline}
  .measurementGrid strong{font-size:1.25rem;color:white;font-variant-numeric:tabular-nums}
  #timePicker{margin-top:12px}
  .small{font-size:13px;color:#c9d0da;margin-top:7px}
  .stage{display:grid;grid-template-rows:minmax(220px,42%) minmax(280px,58%);min-width:0;min-height:0;overflow:hidden}
  .canvasWrap{position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;background:#050608}
  #plotCanvas{border-top:2px solid var(--line);cursor:crosshair}
  @media(max-width:820px){
    html,body{height:auto;overflow:auto}
    .app{grid-template-columns:1fr;height:auto;overflow:visible}
    .controls{border-right:0;overflow:visible}
    .stage{height:620px;grid-template-rows:250px 370px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <label for="Ey">Electric field, E<sub>y</sub> (N/C)<span class="value" id="EyVal"></span></label>
    <input type="range" id="Ey" min="-10" max="10" step="0.1" value="4.2">

    <label for="initialSpeed">Initial horizontal speed, v<sub>x0</sub> (m/s)</label>
    <input type="number" id="initialSpeed" min="0.1" max="50" step="0.1" value="10.0" inputmode="decimal">

    <div class="switchRow">
      <label for="magneticSwitch">Unknown magnetic field</label>
      <span><input type="checkbox" id="magneticSwitch" checked> <span id="magneticStatus">ON</span></span>
    </div>

    <div class="measurement">
      <div class="measurementTitle">Trajectory data</div>
      <div class="measurementGrid">
        <span>Time, t</span><strong id="selectedT">0.000 s</strong>
        <span>Horizontal displacement, x</span><strong id="selectedX">0.000 m</strong>
        <span>Vertical displacement, y</span><strong id="selectedY">0.000 m</strong>
      </div>
      <input type="range" id="timePicker" min="0" max="0" step="0.01" value="0" aria-label="Select measurement time">
    </div>

    <div class="buttons">
      <button id="resetBtn">Reset</button>
      <button id="pauseBtn">Pause</button>
    </div>

    <div class="box readout">
      <b>Elapsed time</b><b id="timeNow">0.000 s</b>
      <span>x position</span><span id="xNow">0.000 m</span>
      <span>y position</span><span id="yNow">0.000 m</span>
    </div>

  </aside>

  <main class="stage">
    <div class="canvasWrap"><canvas id="simCanvas"></canvas></div>
    <div class="canvasWrap"><canvas id="plotCanvas"></canvas></div>
  </main>
</div>

<script>
"use strict";

// Hidden particle parameters. Their ratio is intentionally not displayed.
const q = 0.5;
const m = 0.8;
const hiddenBz = 0.25;

const v0y = 0;
const h = 0.002;          // physics integration step (s)
const maxTime = 5.0;
const sampleEvery = 0.01;

const Ey = document.getElementById("Ey");
const initialSpeed = document.getElementById("initialSpeed");
const magneticSwitch = document.getElementById("magneticSwitch");
const magneticStatus = document.getElementById("magneticStatus");
const EyVal = document.getElementById("EyVal");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const timePicker = document.getElementById("timePicker");
const selectedT = document.getElementById("selectedT");
const selectedX = document.getElementById("selectedX");
const selectedY = document.getElementById("selectedY");
const simCanvas = document.getElementById("simCanvas");
const plotCanvas = document.getElementById("plotCanvas");
const ctx = simCanvas.getContext("2d");
const pctx = plotCanvas.getContext("2d");

let state, data, paused, lastFrame, accumulator, nextSample, hoverIndex;
let inspecting=false;

function fields(){ return {E:+Ey.value, B:magneticSwitch.checked?hiddenBz:0}; }

// Lorentz equations for E=(0,Ey,0), B=(0,0,Bz):
// ax=(q/m) vy Bz,  ay=(q/m)(Ey-vx Bz).
function derivative(s){
  const {E,B}=fields(), r=q/m;
  return {x:s.vx, y:s.vy, vx:r*s.vy*B, vy:r*(E-s.vx*B)};
}

function add(s,k,a){
  return {x:s.x+a*k.x,y:s.y+a*k.y,vx:s.vx+a*k.vx,vy:s.vy+a*k.vy,t:s.t+a};
}

// Fourth-order Runge-Kutta prevents the energy drift of the old Euler update.
function physicsStep(dt){
  const k1=derivative(state);
  const k2=derivative(add(state,k1,dt/2));
  const k3=derivative(add(state,k2,dt/2));
  const k4=derivative(add(state,k3,dt));
  for(const key of ["x","y","vx","vy"])
    state[key]+=dt*(k1[key]+2*k2[key]+2*k3[key]+k4[key])/6;
  state.t+=dt;
  if(state.t+1e-10>=nextSample){
    data.push({t:state.t,x:state.x,y:state.y});
    nextSample+=sampleEvery;
  }
}

function reset(shouldRun=true){
  const speed=Math.max(0.1,Math.min(50,Number(initialSpeed.value)||10));
  initialSpeed.value=speed.toFixed(1);
  state={x:0,y:0,vx:speed,vy:v0y,t:0};
  data=[{t:0,x:0,y:0}];
  paused=!shouldRun; nextSample=sampleEvery; hoverIndex=null;
  inspecting=false; timePicker.max="0"; timePicker.value="0";
  accumulator=0; lastFrame=performance.now();
  pauseBtn.textContent=paused?"Start":"Pause";
  updateText(); draw();
}

function updateText(){
  EyVal.textContent=(+Ey.value).toFixed(2);
  timeNow.textContent=state.t.toFixed(3)+" s";
  xNow.textContent=state.x.toFixed(3)+" m";
  yNow.textContent=state.y.toFixed(3)+" m";
  timePicker.max=state.t.toFixed(3);
  if(!inspecting){
    timePicker.value=state.t.toFixed(3);
    selectedT.textContent=state.t.toFixed(3)+" s";
    selectedX.textContent=state.x.toFixed(3)+" m";
    selectedY.textContent=state.y.toFixed(3)+" m";
  }
}

function resizeCanvas(canvas){
  const dpr=Math.min(devicePixelRatio||1,2), r=canvas.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width*dpr)), hh=Math.max(1,Math.round(r.height*dpr));
  if(canvas.width!==w||canvas.height!==hh){canvas.width=w;canvas.height=hh;}
  return {w:r.width,h:r.height,dpr};
}

function niceLimit(values,minLimit=1){
  const a=Math.max(minLimit,...values.map(v=>Math.abs(v)))*1.15;
  const p=10**Math.floor(Math.log10(a));
  return Math.ceil(a/p*2)/2*p;
}

function drawArrow(c,x,y,dy,color){
  c.strokeStyle=color;c.fillStyle=color;c.lineWidth=1.4;c.beginPath();c.moveTo(x,y-dy/2);c.lineTo(x,y+dy/2);c.stroke();
  const s=Math.sign(dy)||1;c.beginPath();c.moveTo(x,y+dy/2);c.lineTo(x-4,y+dy/2-7*s);c.lineTo(x+4,y+dy/2-7*s);c.closePath();c.fill();
}

function drawSimulation(){
  const {w,h:ch,dpr}=resizeCanvas(simCanvas);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,ch);
  const {E,B}=fields();
  for(let x=35;x<w;x+=55)for(let y=35;y<ch;y+=55){
    if(Math.abs(B)>1e-9){ctx.strokeStyle="#52606f";ctx.lineWidth=1.3;if(B>0){ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);ctx.stroke();ctx.fillStyle="#52606f";ctx.beginPath();ctx.arc(x,y,1.5,0,2*Math.PI);ctx.fill();}else{ctx.beginPath();ctx.moveTo(x-4,y-4);ctx.lineTo(x+4,y+4);ctx.moveTo(x+4,y-4);ctx.lineTo(x-4,y+4);ctx.stroke();}}
    if(Math.abs(E)>1e-9)drawArrow(ctx,x+15,y,E>0?-24:24,"#8b7a31");
  }
  const xs=data.map(d=>d.x), ys=data.map(d=>d.y);
  const xmin=Math.min(0,...xs), xmax=Math.max(20,...xs), ylim=niceLimit(ys,4);
  const pad=45, sx=(w-2*pad)/(xmax-xmin||1), sy=(ch-2*pad)/(2*ylim);
  const X=x=>pad+(x-xmin)*sx, Y=y=>ch/2-y*sy;
  ctx.strokeStyle="#66707e";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,ch/2);ctx.lineTo(w-pad,ch/2);ctx.stroke();
  ctx.fillStyle="#cfd6df";ctx.font="13px Arial";ctx.fillText("x (m)",w-55,ch/2-8);ctx.fillText("+y",pad+7,18);
  ctx.strokeStyle="#56d9ff";ctx.lineWidth=2.3;ctx.beginPath();data.forEach((d,i)=>i?ctx.lineTo(X(d.x),Y(d.y)):ctx.moveTo(X(d.x),Y(d.y)));ctx.stroke();
  ctx.fillStyle="white";ctx.beginPath();ctx.arc(X(state.x),Y(state.y),7,0,2*Math.PI);ctx.fill();
}

function drawPlot(){
  const {w,h:ch,dpr}=resizeCanvas(plotCanvas);pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,w,ch);
  const pad={l:58,r:20,t:20,b:38}, yLim=niceLimit(data.map(d=>d.y),1);
  const X=t=>pad.l+t/maxTime*(w-pad.l-pad.r), Y=y=>pad.t+(yLim-y)/(2*yLim)*(ch-pad.t-pad.b);
  pctx.strokeStyle="#29313b";pctx.lineWidth=1;
  for(let i=0;i<=5;i++){const x=X(i);pctx.beginPath();pctx.moveTo(x,pad.t);pctx.lineTo(x,ch-pad.b);pctx.stroke();pctx.fillStyle="#bfc7d2";pctx.fillText(String(i),x-3,ch-16);}
  for(let i=-2;i<=2;i++){const yv=i*yLim/2,y=Y(yv);pctx.beginPath();pctx.moveTo(pad.l,y);pctx.lineTo(w-pad.r,y);pctx.stroke();pctx.fillStyle="#bfc7d2";pctx.fillText(yv.toFixed(yLim<2?1:0),5,y+4);}
  pctx.fillStyle="#e5e9ef";pctx.font="13px Arial";pctx.fillText("y (m)",8,15);pctx.fillText("time (s)",w-72,ch-16);
  pctx.strokeStyle="#70f59a";pctx.lineWidth=2.2;pctx.beginPath();data.forEach((d,i)=>i?pctx.lineTo(X(d.t),Y(d.y)):pctx.moveTo(X(d.t),Y(d.y)));pctx.stroke();
  if(hoverIndex!==null&&data[hoverIndex]){const d=data[hoverIndex],x=X(d.t),y=Y(d.y);pctx.strokeStyle="#ffd75e";pctx.beginPath();pctx.moveTo(x,pad.t);pctx.lineTo(x,ch-pad.b);pctx.stroke();pctx.fillStyle="#ffd75e";pctx.beginPath();pctx.arc(x,y,5,0,2*Math.PI);pctx.fill();}
}

function showSelectedPoint(){
  const target=+timePicker.value;
  hoverIndex=data.reduce((best,d,i)=>Math.abs(d.t-target)<Math.abs(data[best].t-target)?i:best,0);
  const d=data[hoverIndex];
  selectedT.textContent=d.t.toFixed(3)+" s";
  selectedX.textContent=d.x.toFixed(3)+" m";
  selectedY.textContent=d.y.toFixed(3)+" m";
  drawPlot();
}

function draw(){drawSimulation();drawPlot();}

function animate(now){
  const elapsed=Math.min((now-lastFrame)/1000,0.05);lastFrame=now;
  if(!paused){
    accumulator+=elapsed;
    while(accumulator>=h&&state.t<maxTime){physicsStep(Math.min(h,maxTime-state.t));accumulator-=h;}
    if(state.t>=maxTime){paused=true;pauseBtn.textContent="Resume";}
    updateText();
  }
  draw();requestAnimationFrame(animate);
}

Ey.addEventListener("input",()=>{
  EyVal.textContent=(+Ey.value).toFixed(2);
  reset(false);
});
initialSpeed.addEventListener("change",()=>reset(false));
magneticSwitch.addEventListener("change",()=>{
  magneticStatus.textContent=magneticSwitch.checked?"ON":"OFF";
  reset(false);
});
resetBtn.addEventListener("click",()=>reset(false));
pauseBtn.addEventListener("click",()=>{
  paused=!paused;
  if(!paused){inspecting=false;hoverIndex=null;}
  pauseBtn.textContent=paused?(state.t===0?"Start":"Resume"):"Pause";lastFrame=performance.now();
});
timePicker.addEventListener("input",()=>{
  inspecting=true;paused=true;pauseBtn.textContent="Resume";showSelectedPoint();
});
plotCanvas.addEventListener("mousemove",e=>{
  const r=plotCanvas.getBoundingClientRect(), frac=Math.max(0,Math.min(1,(e.clientX-r.left-58)/(r.width-78))), target=frac*maxTime;
  hoverIndex=data.reduce((best,d,i)=>Math.abs(d.t-target)<Math.abs(data[best].t-target)?i:best,0);
  const d=data[hoverIndex];
  inspecting=true;paused=true;pauseBtn.textContent="Resume";
  timePicker.value=d.t.toFixed(3);selectedT.textContent=d.t.toFixed(3)+" s";selectedX.textContent=d.x.toFixed(3)+" m";selectedY.textContent=d.y.toFixed(3)+" m";
});
plotCanvas.addEventListener("mouseleave",()=>{});
window.addEventListener("resize",draw);

EyVal.textContent=(+Ey.value).toFixed(2);reset(false);requestAnimationFrame(animate);
</script>
</body>
</html>
